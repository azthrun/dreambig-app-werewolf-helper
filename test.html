<title>engine.js 测试</title>
<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; padding: 16px; line-height: 1.7; }
  .pass { color: #1a7f37; }
  .fail { color: #cf222e; font-weight: 700; }

<h1>engine.js 断言测试 — SPEC §18</h1>
<p>结算是 bug 会静默污染实时对局的地方，因此纯函数化并逐场景断言。</p>
<ul id="results"></ul>

<script type="module">
import {
  resolveDawn, buildTriggerQueue, cascadeDeaths, computeStepInfo,
  bearGrowls, validateAction, activeNightSteps, campCounts,
  pickFirstSpeaker, nextAliveSeat,
} from './engine.js';
import {
  ROLE_MAP, DEFAULT_NIGHT_ORDER, DEFAULT_RULES, DEFAULT_SETTINGS,
} from './roles.js';

// ── 极简测试框架 ──────────────────────────────────────────────────
const results = document.getElementById('results');
let passed = 0, failed = 0, pending = 0;

function test(name, fn) {
  const li = document.createElement('li');
  try {
    fn();
    li.className = 'pass';
    li.textContent = `✓ ${name}`;
    passed++;
  } catch (e) {
    if (e.message === '未实现' || e.message === 'PENDING') {
      li.className = 'pending';
      li.textContent = `… ${name} — 待实现`;
      pending++;
    } else {
      li.className = 'fail';
      li.textContent = `✗ ${name} — ${e.message}`;
      failed++;
    }
  }
  results.appendChild(li);
}

function assert(cond, msg) {
  if (!cond) throw new Error(msg || '断言失败');
}

function assertDeaths(actual, expected) {
  const norm = a => a.map(d => `${d.seat}:${d.reason}`).sort().join(', ');
  assert(norm(actual) === norm(expected),
    `期望 [${norm(expected)}]，实际 [${norm(actual)}]`);
}

// ── 夹具 ──────────────────────────────────────────────────────────
/**
 * 简洁构造任意局面。
 *
 * @param {Object}   [opts]
 * @param {number}   [opts.playerCount=9]
 * @param {Object.<number,string>} [opts.roles]     seat → roleId
 * @param {Object.<number,boolean>} [opts.alive]    seat → 存活（默认全存活）
 * @param {Array<[number,number]>} [opts.lovers]    情侣座位对（互相连线）
 * @param {Object.<number,number>} [opts.charmed]   seat(被魅惑者) → seat(狼美人)
 * @param {Object.<number,Object>} [opts.players]   seat → 任意 Player 字段覆盖（含 skills/flags 浅合并）
 * @param {...*}     [opts.*]  其余字段直接覆盖 GameState 顶层键（day, phase, nightOrder, rules, nightActions, ...）
 */
function makeState(opts = {}) {
  const playerCount = opts.playerCount ?? 9;

  const players = [];
  for (let seat = 1; seat <= playerCount; seat++) {
    const roleId = opts.roles?.[seat] ?? null;
    const role = roleId ? ROLE_MAP[roleId] : null;
    const skills = {};
    for (const key of role?.skills ?? []) skills[key] = true;

    players.push({
      seat,
      name: '',
      roleId,
      effectiveRoleId: roleId,
      alive: true,
      deathReason: null,
      deathDay: null,
      deathPhase: null,
      loverSeat: null,
      charmedBySeat: null,
      isSheriff: false,
      skills,
      flags: { idiotRevealed: false, foxDisabled: false },
    });
  }

  for (const [seat, alive] of Object.entries(opts.alive ?? {})) {
    players[Number(seat) - 1].alive = alive;
  }

  for (const [a, b] of opts.lovers ?? []) {
    players[a - 1].loverSeat = b;
    players[b - 1].loverSeat = a;
  }

  for (const [seat, bySeat] of Object.entries(opts.charmed ?? {})) {
    players[Number(seat) - 1].charmedBySeat = bySeat;
  }

  for (const [seat, patch] of Object.entries(opts.players ?? {})) {
    const p = players[Number(seat) - 1];
    Object.assign(p, patch, {
      skills: { ...p.skills, ...(patch.skills ?? {}) },
      flags: { ...p.flags, ...(patch.flags ?? {}) },
    });
  }

  return {
    version: 1,
    screen: 'game',
    playerCount,
    roleCounts: opts.roleCounts ?? {},
    players,
    nightOrder: opts.nightOrder ?? DEFAULT_NIGHT_ORDER.slice(),
    rules: { ...DEFAULT_RULES, ...(opts.rules ?? {}) },
    settings: { ...DEFAULT_SETTINGS, ...(opts.settings ?? {}) },
    day: opts.day ?? 1,
    phase: opts.phase ?? 'night',
    stepIndex: opts.stepIndex ?? 0,
    nightActions: opts.nightActions ?? {},
    lastGuardTarget: opts.lastGuardTarget ?? null,
    pendingDeaths: opts.pendingDeaths ?? [],
    triggerQueue: opts.triggerQueue ?? [],
    timer: opts.timer ?? {
      mode: 'free', endsAt: null, pausedRemaining: null,
      running: false, speechSeat: null, speechDirection: 1,
    },
    log: opts.log ?? [],
    history: opts.history ?? [],
    alert: opts.alert ?? null,
  };
}

// ── 基础纯函数（不依赖结算，issue #3 范围）──────────────────────────

test('activeNightSteps: 过滤缺席角色，仅保留在场角色对应步骤', () => {
  const state = makeState({
    playerCount: 4,
    roles: { 1: 'seer', 2: 'villager', 3: 'villager', 4: 'villager' },
    nightOrder: ['cupid', 'guard', 'wolfkill', 'seer'],
  });
  const steps = activeNightSteps(state);
  assert(JSON.stringify(steps) === JSON.stringify(['seer']),
    `期望 ["seer"]，实际 ${JSON.stringify(steps)}`);
});

test('activeNightSteps: firstNightOnly 步骤仅第一夜出现', () => {
  const base = { playerCount: 2, roles: { 1: 'cupid', 2: 'villager' }, nightOrder: ['cupid'] };
  const night1 = makeState({ ...base, day: 1 });
  const night2 = makeState({ ...base, day: 2 });
  assert(activeNightSteps(night1).includes('cupid'), '第一夜应包含 cupid');
  assert(!activeNightSteps(night2).includes('cupid'), '第二夜不应包含 cupid');
});

test('activeNightSteps: 女巫双药用尽 → 跳过女巫步骤', () => {
  const state = makeState({
    playerCount: 2,
    roles: { 1: 'witch', 2: 'villager' },
    nightOrder: ['witch'],
    players: { 1: { skills: { antidote: false, poison: false } } },
  });
  assert(activeNightSteps(state).length === 0, '双药用尽应跳过女巫步骤');
});

test('activeNightSteps: 女巫仅剩一瓶药仍出现', () => {
  const state = makeState({
    playerCount: 2,
    roles: { 1: 'witch', 2: 'villager' },
    nightOrder: ['witch'],
    players: { 1: { skills: { antidote: false, poison: true } } },
  });
  assert(activeNightSteps(state).includes('witch'), '仍有一瓶药时女巫步骤应保留');
});

test('activeNightSteps: 狐狸失效 → 跳过狐狸步骤', () => {
  const state = makeState({
    playerCount: 2,
    roles: { 1: 'fox', 2: 'villager' },
    nightOrder: ['fox'],
    players: { 1: { flags: { foxDisabled: true } } },
  });
  assert(activeNightSteps(state).length === 0, '狐狸失效应跳过该步骤');
});

test('activeNightSteps: 死亡角色的步骤不出现', () => {
  const state = makeState({
    playerCount: 2,
    roles: { 1: 'seer', 2: 'villager' },
    alive: { 1: false },
    nightOrder: ['seer'],
  });
  assert(activeNightSteps(state).length === 0, '预言家已死不应出现查验步骤');
});

test('campCounts: 仅统计存活且身份已知玩家，未知单独计数', () => {
  const state = makeState({
    playerCount: 5,
    roles: { 1: 'wolf', 2: 'seer', 3: 'villager', 4: 'wolf' },
    alive: { 4: false }, // 座位4已死，不计入
    // 座位5 无角色 → 未知
  });
  const counts = campCounts(state);
  assert(counts.wolf === 1, `wolf 应为1，实际 ${counts.wolf}`);
  assert(counts.god === 1, `god 应为1，实际 ${counts.god}`);
  assert(counts.civ === 1, `civ 应为1，实际 ${counts.civ}`);
  assert(counts.unknown === 1, `unknown 应为1，实际 ${counts.unknown}`);
});

test('nextAliveSeat: 顺时针跳过阵亡座位', () => {
  const state = makeState({ playerCount: 6, alive: { 2: false, 3: false } });
  const seat = nextAliveSeat(state, 1, 1);
  assert(seat === 4, `期望4号，实际 ${seat}`);
});

test('nextAliveSeat: 逆时针环绕取下一个存活座位', () => {
  const state = makeState({ playerCount: 6, alive: { 6: false, 5: false } });
  const seat = nextAliveSeat(state, 1, -1);
  assert(seat === 4, `期望4号，实际 ${seat}`);
});

test('nextAliveSeat: 全员阵亡 → null', () => {
  const alive = {};
  for (let i = 1; i <= 6; i++) alive[i] = false;
  const state = makeState({ playerCount: 6, alive });
  assert(nextAliveSeat(state, 1, 1) === null, '全员阵亡应返回 null');
});

test('nextAliveSeat: 唯一存活座位环绕后返回自身', () => {
  const alive = {};
  for (let i = 1; i <= 6; i++) alive[i] = (i === 3);
  const state = makeState({ playerCount: 6, alive });
  assert(nextAliveSeat(state, 3, 1) === 3, '唯一存活座位应返回自身');
});

test('pickFirstSpeaker: 仅在存活玩家中抽取，且给出座位与方向', () => {
  const state = makeState({ playerCount: 6, alive: { 2: false, 4: false, 6: false } });
  for (let i = 0; i < 50; i++) {
    const { seat, direction } = pickFirstSpeaker(state);
    assert([1, 3, 5].includes(seat), `抽到了阵亡座位 ${seat}`);
    assert(direction === 1 || direction === -1, `方向异常: ${direction}`);
  }
});

test('pickFirstSpeaker: 全员阵亡 → null', () => {
  const alive = {};
  for (let i = 1; i <= 4; i++) alive[i] = false;
  const state = makeState({ playerCount: 4, alive });
  assert(pickFirstSpeaker(state) === null, '全员阵亡应返回 null');
});

// ── SPEC §18 必测场景 ─────────────────────────────────────────────

test('1. 狼刀 + 守卫守护同一人 → 无人死亡', () => {
  const state = makeState({
    playerCount: 9,
    roles: { 1: 'seer', 2: 'witch', 3: 'villager', 4: 'guard' },
    nightActions: { wolfTarget: 3, guardTarget: 3 },
  });
  const { deaths } = resolveDawn(state);
  assertDeaths(deaths, []);
});

test('2. 狼刀 + 女巫解药同一人 → 无人死亡', () => {
  const state = makeState({
    playerCount: 9,
    roles: { 1: 'seer', 2: 'witch', 3: 'villager' },
    nightActions: { wolfTarget: 3, witchAction: { type: 'save', target: 3 } },
  });
  const { deaths } = resolveDawn(state);
  assertDeaths(deaths, []);
});

test('3. 同守同救 → 依开关判定（默认死亡）且触发警告', () => {
  const state = makeState({
    playerCount: 9,
    roles: { 1: 'seer', 2: 'witch', 3: 'villager', 4: 'guard' },
    nightActions: {
      wolfTarget: 3,
      guardTarget: 3,
      witchAction: { type: 'save', target: 3 },
    },
  });
  const { deaths, warnings } = resolveDawn(state);
  assertDeaths(deaths, [{ seat: 3, reason: '被狼杀' }]);
  assert(warnings.length === 1, `期望 1 条警告，实际 ${warnings.length}`);
  assert(warnings[0].seat === 3, `警告座位期望 3，实际 ${warnings[0].seat}`);
});

test('4. 女巫毒杀猎人 → 猎人不入开枪队列（默认开关）', () => {
  throw new Error('PENDING');
});

test('5. 情侣连锁：狼刀情侣 A → B 殉情', () => {
  const state = makeState({
    playerCount: 9,
    roles: { 1: 'seer', 2: 'witch', 3: 'villager', 5: 'villager' },
    lovers: [[3, 5]],
    nightActions: { wolfTarget: 3 },
  });
  const { deaths } = resolveDawn(state);
  assertDeaths(deaths, [
    { seat: 3, reason: '被狼杀' },
    { seat: 5, reason: '殉情' },
  ]);
});

test('6. 情侣+猎人连锁：猎人被投→开枪击中情侣A→B殉情→B为狼王→狼王入队', () => {
  throw new Error('PENDING');
});

test('7. 狼美人死亡 → 被魅惑者殉情', () => {
  throw new Error('PENDING');
});

test('8. 魔术师交换 → 狼刀指向被重定向', () => {
  const state = makeState({
    playerCount: 9,
    roles: { 1: 'magician', 2: 'villager', 3: 'villager', 5: 'villager' },
    nightActions: { wolfTarget: 3, magicianSwap: [3, 5] },
  });
  const { deaths } = resolveDawn(state);
  assertDeaths(deaths, [{ seat: 5, reason: '被狼杀' }]);
});

test('9. 守卫连守违规 → 触发警告但不阻断', () => {
  throw new Error('PENDING');
});

test('10a. 熊咆哮：邻座为狼 → true', () => {
  const state = makeState({
    playerCount: 3,
    roles: { 1: 'wolf', 2: 'bear', 3: 'villager' },
  });
  assert(bearGrowls(state) === true, `期望 true，实际 ${bearGrowls(state)}`);
});

test('10b. 熊咆哮：邻座非狼 → false', () => {
  const state = makeState({
    playerCount: 3,
    roles: { 1: 'villager', 2: 'bear', 3: 'villager' },
  });
  assert(bearGrowls(state) === false, `期望 false，实际 ${bearGrowls(state)}`);
});

test('10c. 熊咆哮：跨越死者取最近存活邻座', () => {
  const state = makeState({
    playerCount: 5,
    roles: { 1: 'wolf', 2: 'villager', 3: 'bear', 4: 'villager', 5: 'villager' },
    alive: { 2: false },
  });
  assert(bearGrowls(state) === true, `期望 true（跨过死者2号取到1号狼人），实际 ${bearGrowls(state)}`);
});

test('10d. 熊咆哮：邻座身份未知 → unknown', () => {
  const state = makeState({
    playerCount: 3,
    roles: { 2: 'bear', 3: 'villager' }, // 座位1未分配身份
  });
  assert(bearGrowls(state) === 'unknown', `期望 unknown，实际 ${bearGrowls(state)}`);
});

test('11. 连锁收敛：循环情侣链不产生死循环', () => {
  const state = makeState({
    playerCount: 5,
    players: {
      1: { loverSeat: 2 },
      2: { loverSeat: 3 },
      3: { loverSeat: 1 },
    },
    nightActions: { wolfTarget: 1 },
  });
  const { deaths } = resolveDawn(state);
  assertDeaths(deaths, [
    { seat: 1, reason: '被狼杀' },
    { seat: 2, reason: '殉情' },
    { seat: 3, reason: '殉情' },
  ]);
});

// ── computeStepInfo / validateAction（issue #6 范围）──────────────────

test('computeStepInfo camp: 查验狼人 → 狼人', () => {
  const state = makeState({ playerCount: 3, roles: { 1: 'seer', 2: 'wolf', 3: 'villager' } });
  const info = computeStepInfo(state, 'seer', [2]);
  assert(info.known === true && info.result === '狼人', `实际 ${JSON.stringify(info)}`);
});

test('computeStepInfo camp: 查验隐狼 → 按房规判为好人', () => {
  const state = makeState({ playerCount: 3, roles: { 1: 'seer', 2: 'hiddenwolf', 3: 'villager' } });
  const info = computeStepInfo(state, 'seer', [2]);
  assert(info.known === true && info.result === '好人', `实际 ${JSON.stringify(info)}`);
});

test('computeStepInfo camp: 目标身份未知 → known:false', () => {
  const state = makeState({ playerCount: 3, roles: { 1: 'seer' } });
  const info = computeStepInfo(state, 'seer', [2]);
  assert(info.known === false, `实际 ${JSON.stringify(info)}`);
});

test('computeStepInfo exactRole: 通灵师查验精确身份', () => {
  const state = makeState({ playerCount: 3, roles: { 1: 'psychic', 2: 'witch', 3: 'villager' } });
  const info = computeStepInfo(state, 'psychic', [2]);
  assert(info.known === true && info.result === '女巫', `实际 ${JSON.stringify(info)}`);
});

test('computeStepInfo lastLynchedRole: 自动识别昨日被放逐者', () => {
  const state = makeState({
    playerCount: 3,
    roles: { 1: 'gravekeeper', 2: 'wolf', 3: 'villager' },
    day: 2,
    players: { 2: { alive: false, deathDay: 1, deathPhase: 'day', deathReason: '被投票' } },
  });
  const info = computeStepInfo(state, 'gravekeeper', []);
  assert(info.known === true && info.result === '普通狼人', `实际 ${JSON.stringify(info)}`);
});

test('computeStepInfo lastLynchedRole: 无人被放逐 → known:false', () => {
  const state = makeState({ playerCount: 3, roles: { 1: 'gravekeeper' }, day: 2 });
  const info = computeStepInfo(state, 'gravekeeper', []);
  assert(info.known === false, `实际 ${JSON.stringify(info)}`);
});

test('computeStepInfo nightDeath: 显示今晚狼刀目标', () => {
  const state = makeState({
    playerCount: 3, roles: { 1: 'witch', 2: 'wolf', 3: 'villager' },
    nightActions: { wolfTarget: 3 },
  });
  const info = computeStepInfo(state, 'witch', []);
  assert(info.known === true && info.seat === 3, `实际 ${JSON.stringify(info)}`);
});

test('computeStepInfo foxCheck: 三连查验存在狼人', () => {
  const state = makeState({
    playerCount: 5,
    roles: { 1: 'fox', 2: 'villager', 3: 'wolf', 4: 'villager', 5: 'villager' },
  });
  const info = computeStepInfo(state, 'fox', [2]);
  assert(info.known === true && info.hasWolf === true && info.disablesFox === false,
    `实际 ${JSON.stringify(info)}`);
});

test('computeStepInfo foxCheck: 三连无狼人 → 驱动技能永久失效', () => {
  const state = makeState({
    playerCount: 5,
    roles: { 1: 'fox', 2: 'villager', 3: 'seer', 4: 'villager', 5: 'villager' },
  });
  const info = computeStepInfo(state, 'fox', [2]);
  assert(info.known === true && info.hasWolf === false && info.disablesFox === true,
    `实际 ${JSON.stringify(info)}`);
});

test('computeStepInfo foxCheck: 三连中有身份未知 → known:false', () => {
  const state = makeState({
    playerCount: 5,
    roles: { 1: 'fox', 2: 'villager', 4: 'villager', 5: 'villager' }, // 座位3未分配
  });
  const info = computeStepInfo(state, 'fox', [2]);
  assert(info.known === false, `实际 ${JSON.stringify(info)}`);
});

test('computeStepInfo bearGrowl: 应咆哮', () => {
  const state = makeState({ playerCount: 3, roles: { 1: 'wolf', 2: 'bear', 3: 'villager' } });
  const info = computeStepInfo(state, 'bear', []);
  assert(info.known === true && info.growl === true, `实际 ${JSON.stringify(info)}`);
});

test('validateAction: 守卫连守 → 警告但不阻断', () => {
  const state = makeState({
    playerCount: 3, roles: { 1: 'guard' }, lastGuardTarget: 2,
  });
  const warnings = validateAction(state, 'guard', { target: 2 });
  assert(warnings.length === 1 && warnings[0].type === 'guardRepeat', `实际 ${JSON.stringify(warnings)}`);
});

test('validateAction: 守卫更换目标不触发连守警告', () => {
  const state = makeState({ playerCount: 3, roles: { 1: 'guard' }, lastGuardTarget: 2 });
  const warnings = validateAction(state, 'guard', { target: 3 });
  assert(warnings.length === 0, `实际 ${JSON.stringify(warnings)}`);
});

test('validateAction: 女巫自救（firstNightOnly）首夜允许，无警告', () => {
  const state = makeState({ playerCount: 3, roles: { 1: 'witch' }, day: 1 });
  const warnings = validateAction(state, 'witch', { type: 'save', target: 1 });
  assert(warnings.length === 0, `实际 ${JSON.stringify(warnings)}`);
});

test('validateAction: 女巫自救（firstNightOnly）非首夜 → 警告', () => {
  const state = makeState({ playerCount: 3, roles: { 1: 'witch' }, day: 2 });
  const warnings = validateAction(state, 'witch', { type: 'save', target: 1 });
  assert(warnings.some(w => w.type === 'witchSelfSave'), `实际 ${JSON.stringify(warnings)}`);
});

test('validateAction: 女巫自救（never）→ 任何夜都警告', () => {
  const state = makeState({ playerCount: 3, roles: { 1: 'witch' }, day: 1, rules: { witchSelfSave: 'never' } });
  const warnings = validateAction(state, 'witch', { type: 'save', target: 1 });
  assert(warnings.some(w => w.type === 'witchSelfSave'), `实际 ${JSON.stringify(warnings)}`);
});

test('validateAction: 女巫同夜双药（默认不可）→ 警告', () => {
  const state = makeState({
    playerCount: 3, roles: { 1: 'witch' },
    nightActions: { witchAction: { type: 'save', target: 2 } },
  });
  const warnings = validateAction(state, 'witch', { type: 'poison', target: 3 });
  assert(warnings.some(w => w.type === 'witchBothPotions'), `实际 ${JSON.stringify(warnings)}`);
});

test('validateAction: 女巫同夜双药（开关允许）→ 无警告', () => {
  const state = makeState({
    playerCount: 3, roles: { 1: 'witch' }, rules: { witchBothPotions: true },
    nightActions: { witchAction: { type: 'save', target: 2 } },
  });
  const warnings = validateAction(state, 'witch', { type: 'poison', target: 3 });
  assert(warnings.length === 0, `实际 ${JSON.stringify(warnings)}`);
});

summary.innerHTML = `<strong>通过 ${passed} · 失败 ${failed} · 待实现 ${pending}</strong>`;

</script>
