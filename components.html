<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组件预览 — 角色图标</title>
<link rel="stylesheet" href="./style.css">
<style>
  body {
    padding: var(--space-6);
    max-width: 720px;
    margin: 0 auto;
  }
  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
    margin-bottom: var(--space-6);
  }
  .preview-header h1 {
    font-size: 18px;
    margin: 0;
  }
  .icon-group h2 {
    font-size: 14px;
    color: var(--color-neutral-600);
    border-bottom: 2px solid var(--color-divider);
    padding-bottom: var(--space-2);
    margin: var(--space-6) 0 var(--space-4);
  }
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: var(--space-4);
  }
  .icon-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-3);
    border: 2px solid var(--color-divider);
  }
  .icon-card svg {
    width: 24px;
    height: 24px;
    color: var(--color-text);
    flex-shrink: 0;
  }
  .icon-card .icon-name {
    font-size: 13px;
    text-align: center;
  }
  .icon-card .icon-id {
    font-size: 11px;
    color: var(--color-neutral-600);
  }
</style>
</head>
<body>

<div class="preview-header">
  <h1>角色图标 sprite 预览 — SPEC §12.5</h1>
  <button type="button" class="btn btn-secondary" id="theme-toggle">切换主题</button>
</div>

<div id="icon-sprite" hidden></div>

<div id="groups"></div>

<script type="module">
import { ROLES, CAMP, CAMP_NAME } from './roles.js';

async function inlineSprite() {
  const res = await fetch('./icons.svg');
  const text = await res.text();
  document.getElementById('icon-sprite').innerHTML = text;
}

function iconCard(iconId, name) {
  const card = document.createElement('div');
  card.className = 'icon-card';
  card.innerHTML = `
    <svg aria-hidden="true"><use href="#${iconId}"></use></svg>
    <span class="icon-name">${name}</span>
    <span class="icon-id">${iconId}</span>
  `;
  return card;
}

function renderRoles() {
  const groupsEl = document.getElementById('groups');

  for (const camp of [CAMP.WOLF, CAMP.GOD, CAMP.CIV]) {
    const group = document.createElement('div');
    group.className = 'icon-group';
    group.innerHTML = `<h2>${CAMP_NAME[camp]}</h2>`;
    const grid = document.createElement('div');
    grid.className = 'icon-grid';
    for (const role of ROLES.filter(r => r.camp === camp)) {
      grid.appendChild(iconCard(role.icon, role.name));
    }
    group.appendChild(grid);
    groupsEl.appendChild(group);
  }

  const statusGroup = document.createElement('div');
  statusGroup.className = 'icon-group';
  statusGroup.innerHTML = `<h2>状态标记（非角色，SPEC §5.3）</h2>`;
  const statusGrid = document.createElement('div');
  statusGrid.className = 'icon-grid';
  statusGrid.appendChild(iconCard('icon-lover', '情侣'));
  statusGroup.appendChild(statusGrid);
  groupsEl.appendChild(statusGroup);
}

document.getElementById('theme-toggle').addEventListener('click', () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
});

await inlineSprite();
renderRoles();
</script>

</body>
</html>
