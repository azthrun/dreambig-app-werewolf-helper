<?xml version="1.0" encoding="UTF-8"?>
<!--
  icons.svg — 角色图标 sprite
  SPEC §12.5

  19 个手绘图标 + 1 个情侣状态标记，Lucide 视觉语言：24×24 viewBox、
  1.6px 描边、currentColor、无填充。阵营不以颜色区分（单色方案），
  依靠图形本身与卡片下方的身份文字。

  狼族以「基础狼形 + 修饰符」区分，使驱动死亡触发逻辑的角色可辨识：
    普通狼人 基础狼形 · 狼王 +王冠 · 白狼王 +王冠+爆裂星芒
    狼美人 +唇形/心形 · 隐狼 虚线/残缺轮廓 · 机械狼 +齿轮/螺栓
-->
<svg xmlns="http://www.w3.org/2000/svg" hidden>
  <defs>
    <!-- 共用绘制参数：fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" -->
  </defs>

  <!-- ── 狼人阵营 ─────────────────────────────────────────────── -->

  <!-- 普通狼人：基础狼形 -->
  <symbol id="icon-wolf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6,3 L9,9 L15,9 L18,3 L19,11 L17,16 L12,21 L7,16 L5,11 Z"/>
    <circle cx="9.5" cy="13" r="0.85"/>
    <circle cx="14.5" cy="13" r="0.85"/>
    <line x1="12" y1="16" x2="12" y2="18.3"/>
  </symbol>

  <!-- 狼王：狼形 + 王冠 -->
  <symbol id="icon-wolfking" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6,5 L9,11 L15,11 L18,5 L19,13 L17,17 L12,21 L7,17 L5,13 Z"/>
    <circle cx="9.5" cy="15" r="0.85"/>
    <circle cx="14.5" cy="15" r="0.85"/>
    <line x1="12" y1="18" x2="12" y2="19.7"/>
    <path d="M5,5 L5,1 L8.5,3.3 L12,0.6 L15.5,3.3 L19,1 L19,5"/>
  </symbol>

  <!-- 白狼王：狼形 + 王冠 + 爆裂星芒 -->
  <symbol id="icon-whitewolfking" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6,5 L9,11 L15,11 L18,5 L19,13 L17,17 L12,21 L7,17 L5,13 Z"/>
    <circle cx="9.5" cy="15" r="0.85"/>
    <circle cx="14.5" cy="15" r="0.85"/>
    <line x1="12" y1="18" x2="12" y2="19.7"/>
    <path d="M5,5 L5,1 L8.5,3.3 L12,0.6 L15.5,3.3 L19,1 L19,5"/>
    <line x1="4" y1="1.5" x2="1.5" y2="0.8"/>
    <line x1="4" y1="1.5" x2="1.8" y2="3"/>
    <line x1="20" y1="1.5" x2="22.5" y2="0.8"/>
    <line x1="20" y1="1.5" x2="22.2" y2="3"/>
  </symbol>

  <!-- 狼美人：狼形 + 唇形/心形 -->
  <symbol id="icon-wolfbeauty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6,3 L9,9 L15,9 L18,3 L19,11 L17,16 L12,21 L7,16 L5,11 Z"/>
    <circle cx="9.5" cy="12.3" r="0.85"/>
    <circle cx="14.5" cy="12.3" r="0.85"/>
    <path d="M10.3,15.8 Q10.3,14.5 12,15.3 Q13.7,14.5 13.7,15.8 Q13.7,17 12,18.6 Q10.3,17 10.3,15.8 Z"/>
  </symbol>

  <!-- 隐狼：虚线/残缺狼形 -->
  <symbol id="icon-hiddenwolf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6,3 L9,9 L15,9 L18,3 L19,11 L17,16 L12,21 L7,16 L5,11 Z" stroke-dasharray="2 2.2"/>
  </symbol>

  <!-- 机械狼：狼形 + 齿轮/螺栓 -->
  <symbol id="icon-mechwolf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6,3 L9,9 L15,9 L18,3 L19,11 L17,16 L12,21 L7,16 L5,11 Z"/>
    <circle cx="9.5" cy="13" r="0.85"/>
    <path d="M17.2,13.3 L18.8,14.2 L18.8,16 L17.2,16.9 L15.6,16 L15.6,14.2 Z"/>
    <circle cx="17.2" cy="15.1" r="0.5"/>
  </symbol>

  <!-- ── 神职角色 ─────────────────────────────────────────────── -->

  <!-- 预言家：眼睛 -->
  <symbol id="icon-seer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3,12 C7,6 17,6 21,12 C17,18 7,18 3,12 Z"/>
    <circle cx="12" cy="12" r="2.4"/>
  </symbol>

  <!-- 女巫：药瓶 -->
  <symbol id="icon-witch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5,2.5 L14.5,2.5"/>
    <path d="M10,3 L10,7.5 L16,7.5 L16,3"/>
    <path d="M10,7.5 L6.5,20 L17.5,20 L14,7.5"/>
    <line x1="7.7" y1="14.5" x2="16.3" y2="14.5"/>
  </symbol>

  <!-- 猎人：准星 -->
  <symbol id="icon-hunter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="7"/>
    <circle cx="12" cy="12" r="1.1"/>
    <line x1="12" y1="2" x2="12" y2="5"/>
    <line x1="12" y1="19" x2="12" y2="22"/>
    <line x1="2" y1="12" x2="5" y2="12"/>
    <line x1="19" y1="12" x2="22" y2="12"/>
  </symbol>

  <!-- 守卫：盾牌 -->
  <symbol id="icon-guard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12,2.5 L19,5.5 L19,11.5 C19,16.5 15.5,19.8 12,21.3 C8.5,19.8 5,16.5 5,11.5 L5,5.5 Z"/>
  </symbol>

  <!-- 白痴：小丑帽 -->
  <symbol id="icon-idiot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="17" x2="20" y2="17"/>
    <path d="M6,17 L4,9"/>
    <circle cx="4" cy="7.7" r="1.1"/>
    <path d="M12,17 L12,6"/>
    <circle cx="12" cy="4.7" r="1.1"/>
    <path d="M18,17 L20,9"/>
    <circle cx="20" cy="7.7" r="1.1"/>
  </symbol>

  <!-- 骑士：剑 -->
  <symbol id="icon-knight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="2.5" x2="12" y2="16.5"/>
    <path d="M12,2.5 L10.5,4.5 L13.5,4.5 Z"/>
    <line x1="8" y1="7.5" x2="16" y2="7.5"/>
    <line x1="12" y1="16.5" x2="12" y2="20"/>
    <circle cx="12" cy="21.2" r="1.1"/>
  </symbol>

  <!-- 丘比特：心 + 箭 -->
  <symbol id="icon-cupid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8,9 C8,6.5 11,6 12,8.5 C13,6 16,6.5 16,9 C16,12.5 12,16 12,16 C12,16 8,12.5 8,9 Z"/>
    <line x1="3.5" y1="20.5" x2="19" y2="5"/>
    <path d="M19,5 L15.3,5.3"/>
    <path d="M19,5 L18.7,8.7"/>
    <path d="M3.5,20.5 L5.8,19.2"/>
    <path d="M3.5,20.5 L4.8,18.2"/>
  </symbol>

  <!-- 魔术师：礼帽 -->
  <symbol id="icon-magician" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4,19 Q12,21.5 20,19"/>
    <path d="M8,19 L8,7 L16,7 L16,19"/>
    <line x1="8" y1="15" x2="16" y2="15"/>
  </symbol>

  <!-- 守墓人：墓碑 -->
  <symbol id="icon-gravekeeper" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="5" y1="21" x2="19" y2="21"/>
    <path d="M8,21 L8,10 C8,6.5 16,6.5 16,10 L16,21 Z"/>
    <line x1="12" y1="10.5" x2="12" y2="16.5"/>
    <line x1="9.3" y1="12.5" x2="14.7" y2="12.5"/>
  </symbol>

  <!-- 狐狸：狐狸头 -->
  <symbol id="icon-fox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12,4 L18,8 L20,4 L19,12 L15,17 L12,20 L9,17 L5,12 L4,4 L6,8 Z"/>
    <circle cx="9.5" cy="11.5" r="0.8"/>
    <circle cx="14.5" cy="11.5" r="0.8"/>
    <path d="M12,15.5 L11,17.5 L13,17.5 Z"/>
  </symbol>

  <!-- 熊：熊掌 -->
  <symbol id="icon-bear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="16" rx="5" ry="4"/>
    <circle cx="6" cy="9" r="1.4"/>
    <circle cx="10.3" cy="6.3" r="1.4"/>
    <circle cx="13.7" cy="6.3" r="1.4"/>
    <circle cx="18" cy="9" r="1.4"/>
  </symbol>

  <!-- 通灵师：水晶球 -->
  <symbol id="icon-psychic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="10.5" r="7"/>
    <path d="M6,20.5 L18,20.5 L15.3,17.2 L8.7,17.2 Z"/>
    <line x1="9.3" y1="6.5" x2="9.3" y2="8.7"/>
    <line x1="8.2" y1="7.6" x2="10.4" y2="7.6"/>
  </symbol>

  <!-- ── 平民阵营 ─────────────────────────────────────────────── -->

  <!-- 平民：人形 -->
  <symbol id="icon-villager" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="7" r="3.5"/>
    <path d="M5,21 C5,15 8,12.5 12,12.5 C16,12.5 19,15 19,21"/>
  </symbol>

  <!-- ── 状态标记（非角色） ───────────────────────────────────── -->

  <!-- 情侣：双心，SPEC §5.3 -->
  <symbol id="icon-lover" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5,8.5 C4.5,6.2 7.2,5.7 8.3,7.9 C9.4,5.7 12.1,6.2 12.1,8.5 C12.1,11.5 8.3,14.5 8.3,14.5 C8.3,14.5 4.5,11.5 4.5,8.5 Z"/>
    <path d="M11.9,11.5 C11.9,9.2 14.6,8.7 15.7,10.9 C16.8,8.7 19.5,9.2 19.5,11.5 C19.5,14.5 15.7,17.5 15.7,17.5 C15.7,17.5 11.9,14.5 11.9,11.5 Z"/>
  </symbol>
</svg>
