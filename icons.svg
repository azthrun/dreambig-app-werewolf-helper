<?xml version="1.0" encoding="UTF-8"?>
<!--
  icons.svg — 图标 sprite（<symbol> + <use>）
  SPEC §12.5

  字形取自 Lucide（lucide-static v1.33.0，ISC 许可），内联进本仓库。
  设计稿从 unpkg 运行时加载 Lucide；本应用为 cache-first 离线 PWA，因此改为
  内联 —— 视觉一致，且不引入外部网络依赖、不受上游版本漂移影响（issue #36）。

  符号 ID 命名的是「角色」而非「字形」（icon-wolf 而非 icon-dog）：
  roles.js 的 icon 字段因此无需随换图改动，日后重选字形只改本文件一处。

  描边属性统一由 style.css 的 .icon 类提供，符号内不重复声明。
-->
