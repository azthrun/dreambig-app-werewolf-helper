  <!-- ════════════════════════════════════════════════════════════════
       局内主界面                              SPEC §12.1
       固定：控制区 + 警告区 + 步骤区 ／ 仅玩家网格可滚动
       ════════════════════════════════════════════════════════════════ -->
  <section id="screen-game" class="screen" hidden>

    <header id="game-header" class="game-header">
      <!-- 第 N 晚/天 + 阵营计数条 狼x·神y·民z + 计时器（自由 / 发言两种模式）
           + 撤销 / 日志 / 长按结束                     SPEC §12.1 / §14 / §17 -->
    </header>

    <div id="win-banner" class="win-banner" hidden>
      <!-- 结束条件达成提示 + 长按结束                    SPEC §17 -->
    </div>

    <div id="alert-banner" class="alert-banner" hidden>
      <!-- TODO: 常驻警告横幅，需点击「知道了」确认      SPEC §10.2 -->
    </div>

    <div id="phase-panel" class="phase-panel">
      <!-- TODO: 夜晚 —— 当前步骤名 / 口播提示 / 信息答案 / 完成·跳过
                                                        SPEC §4.2 / §9 -->
      <!-- 白天 —— 死亡公布确认 / 触发队列 / 随机首发言横幅 / 骑士决斗 /
           白狼王自爆 / 狼人自爆 / 进入下一夜               SPEC §4.3 / §5.4 / §15 -->
    </div>

    <div id="player-grid" class="player-grid" data-columns="3">
      <!-- TODO: 玩家卡片；列数随人数自适应 3/4/5        SPEC §12.2 -->
      <!-- TODO: 阵亡卡片折叠至 ~42px -->
    </div>

  </section>

  <!-- ════════════════════════════════════════════════════════════════
       日志页（整页替换，非覆盖层）            SPEC §16
       ════════════════════════════════════════════════════════════════ -->
  <section id="screen-log" class="screen" hidden></section>

  <!-- ════════════════════════════════════════════════════════════════
       战报页                                  SPEC §4.4
       ════════════════════════════════════════════════════════════════ -->
  <section id="screen-report" class="screen" hidden>
    <!-- 胜方点选（好人胜 / 狼人胜 / 平局，不做自动判定）+ 完整名单（座位·姓名·
         身份·死因·死亡时间）+ 总时长 / 天数 + 完整日志 + 复制日志文本 / 开新局
         （长按）/ 返回                                  SPEC §4.4 / §17 -->
  </section>

  <!-- 先执行 + 撤销条：跨屏固定于视口底部，非某一屏内容的一部分，
       故置于 .screen 兄弟层级，不随屏幕切换被隐藏。SPEC §8.2 -->
  <div id="undo-bar" class="undo-bar" hidden></div>

</div>

<script type="module" src="./app.js"></script>
</body>
</html>
